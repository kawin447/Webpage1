<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>ผลลัพธ์จาก Python2.py</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #ffb6c1;
        background: #000;
      }

      .artwork {
        width: min(100vw, 440px);
        height: auto;
      }

      .artwork text {
        opacity: 0;
        animation: appear 220ms ease-out forwards;
      }

      @keyframes appear {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .back-link {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 182, 193, 0.35);
        border-radius: 10px;
        color: #ffb6c1;
        background: rgba(0, 0, 0, 0.75);
        font-size: 0.9rem;
        text-decoration: none;
      }

      .back-link:hover {
        background: rgba(255, 182, 193, 0.12);
      }

      .back-link:focus-visible {
        outline: 2px solid #ffb6c1;
        outline-offset: 3px;
      }

      .replay-button {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 182, 193, 0.35);
        border-radius: 10px;
        color: #ffb6c1;
        background: rgba(0, 0, 0, 0.8);
        font: inherit;
        cursor: pointer;
      }

      .replay-button:hover:not(:disabled) {
        background: rgba(255, 182, 193, 0.12);
      }

      .replay-button:focus-visible {
        outline: 2px solid #ffb6c1;
        outline-offset: 3px;
      }

      .replay-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .artwork text {
          animation: none;
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        .replay-button {
          right: 50%;
          transform: translateX(50%);
        }
      }

    </style>
  </head>
  <body>
    <a class="back-link" href="index.html">กลับไปหน้าใส่รหัส</a>
    <svg
      class="artwork"
      id="python-artwork"
      viewBox="0 0 440 360"
      role="img"
      aria-label="ภาพหัวใจสีชมพูที่ประกอบด้วยข้อความ I Miss You"
      xmlns="http://www.w3.org/2000/svg"
    ></svg>
    <button class="replay-button" id="replay-animation" type="button">
      เล่นแอนิเมชันอีกครั้ง
    </button>
    <p class="visually-hidden" id="animation-status" role="status" aria-live="polite"></p>

    <script>
      const artwork = document.querySelector("#python-artwork");
      const replayButton = document.querySelector("#replay-animation");
      const animationStatus = document.querySelector("#animation-status");
      const centerX = 220;
      const centerY = 180;
      const scale = 11;
      const pointCount = 120;
      const frameDelay = 40;
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      function createLabel(index) {
        const angle = (index * Math.PI * 2) / pointCount;
        const x = 16 * Math.sin(angle) ** 3 * scale;
        const y =
          (13 * Math.cos(angle) -
            5 * Math.cos(2 * angle) -
            2 * Math.cos(3 * angle) -
            Math.cos(4 * angle)) *
          scale;
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");

        text.setAttribute("x", String(centerX + x));
        text.setAttribute("y", String(centerY - y));
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-family", "Arial, sans-serif");
        text.setAttribute("font-size", "8");
        text.setAttribute("font-weight", "bold");
        text.setAttribute("fill", "#ffb6c1");
        text.textContent = "I Miss You";
        return text;
      }

      async function playAnimation() {
        artwork.replaceChildren();
        replayButton.disabled = true;
        animationStatus.textContent = "กำลังแสดงแอนิเมชัน";

        for (let i = 0; i < pointCount; i += 1) {
          artwork.append(createLabel(i));
          if (!prefersReducedMotion) {
            await new Promise((resolve) => window.setTimeout(resolve, frameDelay));
          }
        }

        animationStatus.textContent = "แสดงแอนิเมชันเสร็จแล้ว";
        replayButton.disabled = false;
      }

      replayButton.addEventListener("click", playAnimation);
      playAnimation();
    </script>
  </body>
</html>
